name: Build Wi-Fi Expert APK

on:
  push:
    branches: [ "main", "master" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: 1. Клонирование репозитория
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: 2. Настройка Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: 3. Установка зависимостей и сборка веб-части
        run: |
          npm ci || npm install --legacy-peer-deps
          npm run build

      - name: 4. Настройка Java 21 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: 5. Настройка Android SDK и принятие лицензий
        run: |
          echo "ANDROID_HOME: $ANDROID_HOME"
          SDKMANAGER=$(which sdkmanager 2>/dev/null || find "$ANDROID_HOME/cmdline-tools" -name sdkmanager 2>/dev/null | head -n 1)
          if [ -n "$SDKMANAGER" ] && [ -x "$SDKMANAGER" ]; then
            echo "Найден sdkmanager: $SDKMANAGER"
            yes | "$SDKMANAGER" --licenses 2>/dev/null || true
            "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0" 2>/dev/null || true
          else
            echo "sdkmanager не найден напрямую, полагаемся на авто-загрузку Gradle (android.builder.sdkDownload=true)"
          fi

      - name: 6. Синхронизация Capacitor с Android
        run: |
          npx cap sync android

      - name: 7. Выдача прав на выполнение Gradle Wrapper
        run: chmod +x android/gradlew

      - name: 8. Сборка Debug APK через Gradle
        run: |
          cd android
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: 9. Копирование готового APK в папку distrib в корне
        run: |
          mkdir -p distrib
          APK_FILE=$(find android/app/build/outputs/apk -name "*.apk" | head -n 1)
          if [ -n "$APK_FILE" ] && [ -f "$APK_FILE" ]; then
            cp "$APK_FILE" distrib/wifi-expert.apk
            cp "$APK_FILE" distrib/wifi-expert-debug.apk
            echo "APK успешно скопирован в папку distrib/:"
            ls -lh distrib/
          else
            echo "::error::APK файл не найден в build outputs!"
            exit 1
          fi

      - name: 10. Сохранение готового APK в артефакты GitHub Actions
        uses: actions/upload-artifact@v4
        with:
          name: wifi-expert-apk
          path: distrib/*.apk
          retention-days: 30

      - name: 11. Автоматический коммит и отправка APK в репозиторий в папку distrib
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add -f distrib/*.apk
          if git diff --staged --quiet; then
            echo "Изменений в distrib/*.apk нет, коммит не требуется."
          else
            git commit -m "build(distrib): update compiled Android APK [skip ci]"
            git pull --rebase origin ${{ github.ref_name }} || true
            if git push origin HEAD:${{ github.ref_name }}; then
              echo "APK успешно закоммичен и отправлен в репозиторий!"
            else
              echo "::warning::Не удалось запушить в репозиторий. Проверьте: Settings -> Actions -> General -> Workflow permissions -> 'Read and write permissions'."
            fi
          fi

      - name: 12. Публикация APK в GitHub Releases (при релизном теге v*)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: distrib/*.apk
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

